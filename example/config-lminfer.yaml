# ToyAgent 配置示例：LMInfer 后端（Qwen3-0.6B，agent 模式）
#
# 启动方式:
#   python -m lminfer serve /home/tanger/workspace/models/Qwen3-0.6B \
#       --served-model-name Qwen3-0.6B --port 8000
#   python main.py --config example/config-lminfer.yaml
#
# agent_mode: true 时, 每次模型请求携带 mode/trace/session_id,
# LMInfer 把主/子 agent 的调用关联到同一个会话并累计消耗,
# 运行结束后用 GET /v1/agent/sessions 观测。

# ---- LMInfer 服务连接 ----
base_url: http://localhost:8000/v1
model: Qwen3-0.6B              # 需与 --served-model-name 一致
api_key: EMPTY

# ---- 运行时参数 ----
temperature: 0.3              # 低温度让工具调用更稳定（0.7 容易让模型跳过工具直接作答）
max_tokens: 1024
max_iters: 6
sub_max_iters: 4              # sub agent 最大轮数（留出「调用文件工具后再作答」的空间）
tool_mode: auto
force_tool_call: false        # 默认关：主 agent 自主决定是否调用子代理/文件工具
                              # （小模型工具调用不稳定时可改 true 强制首轮先分派）
quiet: false
agent_mode: true               # LMInfer agent 模式(默认即开, 设 false 兼容 vLLM)
enable_thinking: false         # Qwen3 等模型 thinking 开关(可选): true 开 / false 关, 不写则用服务端默认

# ---- 任务（文件操作 + 子代理分派：主 agent 用 read_file 读文件、把调研交给 researcher）----
task: |
  请完成下面这个「调研 + 文件操作」任务:
  1. 用 read_file 读取本仓库的 requirements.txt，了解项目依赖；
  2. 把「如何用最少的第三方依赖实现一个 OpenAI 兼容的 LLM 客户端？」交给 researcher 子代理调研；
  3. 综合两者结果输出：第一行「依赖清单：」+ requirements.txt 中的依赖；
     第二行「调研结论：」+ researcher 结论的要点。
  请自主决定调用哪些工具、以什么顺序完成；第 1、2 步不要跳过。

# ---- sub agents: 名称 -> 系统提示词（可自由增删改；都带文件工具，可自己读文件/写文件）----
sub_agents:
  researcher: |
    你是 researcher sub agent，负责快速给出准确的事实、定义与实现思路调研结果。
    你可以使用文件工具（read_file/list_directory/search_files 等）查看本地文件来辅助调研，
    需要时再调用；直接输出调研结论（要点即可），不要寒暄。
  writer: |
    你是 writer sub agent，负责根据任务要求完成具体产出（如编写代码、撰写文本）。
    你可以使用文件工具：需要参考本地文件时用 read_file，需要产出文件时用 write_file。
    直接输出完整产出，不要寒暄。
  reviewer: |
    你是 reviewer sub agent，负责审查他人给出的实现或结论：找出错误、遗漏与可改进点，
    输出明确的审查意见。需要查看被审查的文件时可以使用 read_file 等文件工具。
